name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python plugins/legit-pdf2md/skills/legit-pdf2md/scripts/clean_gdoc_md.py selftest
      - run: python tests/run_fixtures.py
